services:
  postgres:
    image: postgres:16-alpine
    container_name: ludi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ludi
      POSTGRES_PASSWORD: ludi
      POSTGRES_DB: ludi
    ports:
      - "5432:5432"
    volumes:
      - ludi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludi -d ludi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ludi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ludi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ludi_pg_data:
  ludi_redis_data:
